<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约系统 · 用户端 (Supabase)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fc; }
        .card-shadow { box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: none; }
        .time-hint { background: #e8f0fe; padding: 8px 12px; border-radius: 20px; font-size: 0.9rem; }
    </style>
</head>
<body class="py-4">

<div class="container">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">📅 轻松预约 · 用户端</h2>
        <p class="text-muted">填写表单选择时段，可随时查看已被预约的时间</p>
    </div>

    <div class="row g-4">
        <!-- 左侧：预约表单 -->
        <div class="col-lg-5">
            <div class="card card-shadow rounded-4 p-3">
                <div class="card-body">
                    <h5 class="card-title mb-3"><i class="bi bi-pencil-square"></i> 新建预约</h5>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" class="form-control" id="name" placeholder="例如：张三" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">联系电话</label>
                            <input type="tel" class="form-control" id="phone" placeholder="手机号码" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">预约日期</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">预约时间</label>
                                <input type="time" class="form-control" id="time" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">服务项目</label>
                            <select class="form-select" id="service" required>
                                <option value="" disabled selected>-- 请选择 --</option>
                                <option value="理发">💇 理发</option>
                                <option value="美容">💆 美容</option>
                                <option value="咨询">📋 咨询</option>
                                <option value="维修">🔧 维修</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注 (选填)</label>
                            <textarea class="form-control" id="notes" rows="2" placeholder="特殊要求..."></textarea>
                        </div>

                        <div class="time-hint mb-3" id="selectedDateHint">
                            <span class="fw-light">📌 请先选择日期，查看已约时段</span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">提交预约</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 右侧：所有已预约时段 (公开) -->
        <div class="col-lg-7">
            <div class="card card-shadow rounded-4">
                <div class="card-body">
                    <h5 class="card-title mb-3"><i class="bi bi-clock-history"></i> 当前已预约时段 (公开)</h5>
                    <div class="mb-2 text-secondary small">仅显示已被占用的日期和时间，保护隐私</div>
                    <div id="publicSlotsContainer" style="max-height: 400px; overflow-y: auto;">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>日期</th>
                                    <th>时间</th>
                                    <th>服务</th>
                                </tr>
                            </thead>
                            <tbody id="publicSlotsBody">
                                <tr><td colspan="3" class="text-center text-muted">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="mt-3 text-end">
                <a href="admin.html" target="_blank" class="text-decoration-none">⚙️ 前往管理端 (需登录)</a>
            </div>
        </div>
    </div>
</div>

<!-- 引入 Supabase SDK -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
    // 初始化 Supabase 客户端 (请替换为您的项目URL和anon密钥)
    const SUPABASE_URL = 'https://zrclgxyfnqkcydpwzxcj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY2xneHlmbnFrY3lkcHd6eGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMjcyNTksImV4cCI6MjA4ODYwMzI1OX0.18p_JzQbDeD1QS1RxBZnHuMDKCneZUqNqZQmBikRDgU';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 全局存储公开时段
    let publicAppointments = [];

    // 加载公开时段
    async function loadPublicSlots() {
        try {
            const { data, error } = await supabase
                .from('appointments')
                .select('date, time, service')
                .order('date', { ascending: true })
                .order('time', { ascending: true });

            if (error) throw error;
            publicAppointments = data || [];
            renderPublicSlots(publicAppointments);
            updateSelectedDateHint();
        } catch (err) {
            console.error(err);
            document.getElementById('publicSlotsBody').innerHTML = `<tr><td colspan="3" class="text-center text-danger">加载失败</td></tr>`;
        }
    }

    function renderPublicSlots(slots) {
        const tbody = document.getElementById('publicSlotsBody');
        if (!slots.length) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">暂无预约数据</td></tr>`;
            return;
        }
        let html = '';
        slots.forEach(item => {
            html += `<tr>
                <td>${escapeHtml(item.date)}</td>
                <td>${escapeHtml(item.time)}</td>
                <td>${escapeHtml(item.service)}</td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    function updateSelectedDateHint() {
        const dateInput = document.getElementById('date');
        const selectedDate = dateInput.value;
        const hintEl = document.getElementById('selectedDateHint');
        if (!selectedDate) {
            hintEl.innerHTML = `<span class="fw-light">📌 请先选择日期</span>`;
            return;
        }
        const slotsOnDate = publicAppointments.filter(item => item.date === selectedDate);
        if (slotsOnDate.length === 0) {
            hintEl.innerHTML = `<span class="text-success">✅ 所选日期 ${selectedDate} 目前全天空闲</span>`;
        } else {
            const times = slotsOnDate.map(item => item.time).sort();
            hintEl.innerHTML = `<span class="text-warning-dark">⏰ 所选日期已有预约： ${times.join('  ·  ')}</span>`;
        }
    }

    // 提交新预约
    async function submitBooking(formData) {
        try {
            // 先检查是否冲突
            const { data: conflict, error: conflictError } = await supabase
                .from('appointments')
                .select('id')
                .eq('date', formData.date)
                .eq('time', formData.time)
                .maybeSingle();

            if (conflictError) throw conflictError;
            if (conflict) {
                alert('该时段已被预约，请选择其他时间');
                return false;
            }

            const { error } = await supabase
                .from('appointments')
                .insert([formData]);

            if (error) throw error;
            alert('预约成功！');
            await loadPublicSlots();
            return true;
        } catch (err) {
            alert('提交失败：' + err.message);
            console.error(err);
            return false;
        }
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function setDefaultDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        setDefaultDate();
        loadPublicSlots();

        const form = document.getElementById('bookingForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const service = document.getElementById('service').value;
            const notes = document.getElementById('notes').value.trim();

            if (!name || !phone || !date || !time || !service) {
                alert('请完整填写所有必填项');
                return;
            }

            // 简单前端冲突检查（基于已加载的公开数据）
            if (publicAppointments.some(item => item.date === date && item.time === time)) {
                alert('该时段已被预约，请选择其他时间');
                return;
            }

            const formData = { name, phone, date, time, service, notes };
            const success = await submitBooking(formData);
            if (success) {
                document.getElementById('name').value = '';
                document.getElementById('phone').value = '';
                document.getElementById('time').value = '';
                document.getElementById('service').value = '';
                document.getElementById('notes').value = '';
            }
        });

        document.getElementById('date').addEventListener('change', updateSelectedDateHint);
    });
</script>

<!-- Bootstrap Icons (可选) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</body>
</html>
