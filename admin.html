<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约系统 · 管理端 (Supabase)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f6; }
        .card-shadow { box-shadow: 0 12px 28px rgba(0,0,0,0.08); border: none; border-radius: 24px; }
        .login-box { max-width: 400px; margin: 60px auto; }
        .badge-service { background-color: #d9e6f2; color: #1a4d80; }
    </style>
</head>
<body class="py-4">

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">🔐 管理控制台</h2>
        <div>
            <button class="btn btn-outline-secondary btn-sm" id="logoutBtn" style="display: none;">登出</button>
        </div>
    </div>

    <!-- 登录面板 -->
    <div id="loginPanel" class="login-box">
        <div class="card card-shadow p-4">
            <h4 class="text-center mb-3">管理员登录</h4>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="admin@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary w-100" id="loginBtn">登录</button>
            <div class="mt-3 text-muted small text-center">
                请在 Supabase 控制台的 Authentication 中创建管理员用户<br>
                （默认无内置账户）
            </div>
            <div class="mt-2 text-center">
                <a href="index.html" target="_blank" class="text-decoration-none small">⬅ 返回用户端</a>
            </div>
        </div>
    </div>

    <!-- 管理面板 (登录后显示) -->
    <div id="adminPanel" style="display: none;">
        <div class="card card-shadow p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">📋 全部预约列表</h5>
                <div>
                    <button class="btn btn-danger btn-sm me-2" id="clearAllBtn">清空所有预约</button>
                    <button class="btn btn-secondary btn-sm" id="refreshBtn">刷新</button>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>姓名</th>
                            <th>电话</th>
                            <th>日期</th>
                            <th>时间</th>
                            <th>服务</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr><td colspan="7" class="text-center text-muted">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="text-muted small mt-2">* 点击删除可移除预约，数据实时保存</div>
        </div>
    </div>
</div>

<!-- 引入 Supabase SDK -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
    // 初始化 Supabase 客户端 (请替换为您的项目URL和anon密钥)
    const SUPABASE_URL = 'https://zrclgxyfnqkcydpwzxcj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyY2xneHlmbnFrY3lkcHd6eGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMjcyNTksImV4cCI6MjA4ODYwMzI1OX0.18p_JzQbDeD1QS1RxBZnHuMDKCneZUqNqZQmBikRDgU';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 当前登录用户
    let currentUser = null;

    // DOM 元素
    const loginPanel = document.getElementById('loginPanel');
    const adminPanel = document.getElementById('adminPanel');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginBtn = document.getElementById('loginBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const adminTableBody = document.getElementById('adminTableBody');

    // 检查本地是否已有会话
    async function checkSession() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            showAdminPanel();
            loadAppointments();
        } else {
            showLoginPanel();
        }
    }

    // 登录
    async function login(email, password) {
        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });
            if (error) throw error;
            currentUser = data.user;
            showAdminPanel();
            loadAppointments();
        } catch (err) {
            alert('登录失败：' + err.message);
        }
    }

    // 登出
    async function logout() {
        await supabase.auth.signOut();
        currentUser = null;
        showLoginPanel();
    }

    function showAdminPanel() {
        loginPanel.style.display = 'none';
        adminPanel.style.display = 'block';
        logoutBtn.style.display = 'inline-block';
    }

    function showLoginPanel() {
        loginPanel.style.display = 'block';
        adminPanel.style.display = 'none';
        logoutBtn.style.display = 'none';
    }

    // 加载所有预约（管理端可见全部字段）
    async function loadAppointments() {
        adminTableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">加载中...</td></tr>`;
        try {
            const { data, error } = await supabase
                .from('appointments')
                .select('*')
                .order('date', { ascending: false })
                .order('time', { ascending: false });

            if (error) throw error;
            renderAdminTable(data || []);
        } catch (err) {
            adminTableBody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">加载失败：${err.message}</td></tr>`;
        }
    }

    function renderAdminTable(appointments) {
        if (!appointments.length) {
            adminTableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">暂无预约数据</td></tr>`;
            return;
        }
        let html = '';
        appointments.forEach(appt => {
            html += `<tr data-id="${escapeHtml(appt.id)}">
                <td>${escapeHtml(appt.name)}</td>
                <td>${escapeHtml(appt.phone)}</td>
                <td>${escapeHtml(appt.date)}</td>
                <td>${escapeHtml(appt.time)}</td>
                <td><span class="badge badge-service">${escapeHtml(appt.service)}</span></td>
                <td>${escapeHtml(appt.notes || '—')}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${escapeHtml(appt.id)}">删除</button>
                </td>
            </tr>`;
        });
        adminTableBody.innerHTML = html;

        // 绑定删除事件
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                if (confirm('确定删除该预约吗？')) {
                    await deleteAppointment(id);
                }
            });
        });
    }

    // 删除单个预约
    async function deleteAppointment(id) {
        try {
            const { error } = await supabase
                .from('appointments')
                .delete()
                .eq('id', id);
            if (error) throw error;
            await loadAppointments();
        } catch (err) {
            alert('删除失败：' + err.message);
        }
    }

    // 清空所有预约
    async function clearAllAppointments() {
        if (!confirm('⚠️ 确定要删除全部预约吗？此操作不可恢复。')) return;
        try {
            const { error } = await supabase
                .from('appointments')
                .delete()
                .gte('id', '00000000-0000-0000-0000-000000000000'); // 删除所有
            if (error) throw error;
            await loadAppointments();
        } catch (err) {
            alert('清空失败：' + err.message);
        }
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 事件绑定
    loginBtn.addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) {
            alert('请输入邮箱和密码');
            return;
        }
        login(email, password);
    });

    logoutBtn.addEventListener('click', logout);
    refreshBtn.addEventListener('click', loadAppointments);
    clearAllBtn.addEventListener('click', clearAllAppointments);

    // 初始化会话检查
    checkSession();

    // 监听认证状态变化（例如在其他标签页登出）
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') {
            showLoginPanel();
        } else if (event === 'SIGNED_IN' && session) {
            currentUser = session.user;
            showAdminPanel();
            loadAppointments();
        }
    });
</script>
</body>
</html>
